<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="t">
<title id="t">01 — About me</title>
<defs>
  <linearGradient id="line" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#C77B9B"/><stop offset=".65" stop-color="#701A3D"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#E5B5C7"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#E5B5C7"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .serif{font-family:Georgia,"Times New Roman",serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .enter{animation:enter .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.enter{animation:none}}
</style>
<g class="enter">
  <text class="mono" x="40" y="31" font-size="11" letter-spacing="3" fill="#C77B9B"><tspan fill="#E5B5C7">01</tspan>  /  ABOUT</text>
  <text class="serif" x="38" y="83" font-size="43" font-weight="300" letter-spacing="-1" fill="#F8F0F3">A little <tspan font-style="italic" fill="url(#shine)">about me.</tspan></text>
  <text class="mono" x="1160" y="32" text-anchor="end" font-size="10" letter-spacing="2.2" fill="#B6A3AC">BACKGROUND · INTERESTS · DIRECTION</text>
</g>
<path d="M40 106H1160" stroke="url(#line)" stroke-width="1"/>
<circle cx="40" cy="106" r="3" fill="#E5B5C7"/>
</svg>