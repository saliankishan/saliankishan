<desc id="desc">A bold burgundy profile panel introducing Kishan, an MCA student focused on data analytics and practical software.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160D12"/><stop offset="1" stop-color="#321321"/></linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9AFC1"/><stop offset="1" stop-color="#8B3657"/></linearGradient>
