<rect width="1200" height="300" rx="24" fill="url(#panel)" stroke="#70304A" stroke-width="2"/>
<text x="42" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="178" font-weight="800" letter-spacing="-12" fill="url(#num)" opacity=".95">01</text>
<path d="M225 48V252" stroke="#8B3657" stroke-width="3"/>
<g font-family="Segoe UI,Arial,sans-serif">
  <text x="270" y="66" fill="#E9AFC1" font-size="17" font-weight="700" letter-spacing="5">THE PERSON BEHIND THE CODE</text>
