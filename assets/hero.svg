<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Kishan Salian — Data and software</title>
<desc id="d">A burgundy developer profile banner featuring Kishan's own illustrated portrait and a data visualization motif.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10090D"/><stop offset=".55" stop-color="#35101F"/><stop offset="1" stop-color="#701A3D"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#C77B91"/><stop offset="1" stop-color="#F1C5D0"/></linearGradient>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9AFC1" stop-opacity=".65"/><stop offset="1" stop-color="#701A3D" stop-opacity=".2"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="portraitClip"><rect x="700" y="0" width="330" height="360" rx="22"/></clipPath>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<g opacity=".13" stroke="#F5DCE4"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/></g>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="76" y="75" fill="#E9B9C8" font-size="17" letter-spacing="5">KISHAN D SALIAN / DEVELOPER PROFILE</text>
 <text x="72" y="165" fill="#FFF7FA" font-size="66" font-weight="700" letter-spacing="-2">Building with</text>
 <text x="72" y="238" fill="#E9AFC1" font-size="66" font-weight="700" letter-spacing="-2">curiosity &amp; data.</text>
 <text x="77" y="290" fill="#F5DCE4" font-size="20" letter-spacing="1.2">MCA STUDENT  ·  PYTHON  ·  SQL  ·  ANALYTICS</text>
</g>
<rect x="694" y="-6" width="342" height="372" rx="26" fill="none" stroke="url(#frame)" stroke-width="3"/>
<g clip-path="url(#portraitClip)">
 <image href="https://raw.githubusercontent.com/saliankishan/saliankishan/main/assets/profile.jpg" x="700" y="-18" width="330" height="412" preserveAspectRatio="xMidYMid slice"/>
 <rect x="700" y="0" width="330" height="360" fill="none" stroke="#E9AFC1" stroke-opacity=".22"/>
</g>
<circle cx="1110" cy="158" r="86" fill="none" stroke="#C77B91" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="1110" cy="158" r="60" fill="none" stroke="#C77B91" stroke-opacity=".35" stroke-dasharray="5 9"/>
<g filter="url(#glow)" fill="none" stroke="url(#line)" stroke-width="3"><path d="M1037 205L1065 180 1088 192 1110 125 1135 148 1160 92 1180 112"/><path d="M1037 228L1065 215 1088 223 1110 198 1135 210 1160 183 1180 192" opacity=".5"/></g>
<g fill="#F5E9ED"><circle cx="1065" cy="180" r="4.5"/><circle cx="1110" cy="125" r="4.5"/><circle cx="1160" cy="92" r="4.5"/></g>
<text x="1040" y="320" fill="#F5DCE4" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.2">OBSERVE / ANALYSE / BUILD</text>
<circle cx="1150" cy="55" r="3" fill="#F1C5D0"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>