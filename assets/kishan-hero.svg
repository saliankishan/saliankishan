<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="kh-title kh-desc">
  <title id="kh-title">Kishan Salian</title>
  <desc id="kh-desc">Aspiring Data Analyst | SQL, Python and Pandas | MCA student at MIT, MAHE</desc>
  <defs>
    <linearGradient id="kh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="kh-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kh-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <radialGradient id="kh-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="kh-blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Static base (fallback when motion is unsupported) -->
  <rect width="1200" height="320" rx="16" fill="url(#kh-bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#kh-grid)"/>

  <!-- Moving light -->
  <circle cx="200" cy="80" r="260" fill="url(#kh-light)">
    <animate attributeName="cx" values="200;1000;200" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;240;80" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbital geometry -->
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
    <circle cx="1020" cy="160" r="110"/>
    <circle cx="1020" cy="160" r="70" stroke-dasharray="3 7"/>
    <ellipse cx="1020" cy="160" rx="140" ry="44" transform="rotate(-24 1020 160)"/>
  </g>
  <circle r="5" fill="#E5B5C7">
    <animateMotion dur="9s" repeatCount="indefinite" path="M1130 160 A110 110 0 1 1 1130 160.01"/>
  </circle>
  <circle cx="1020" cy="160" r="6" fill="#701A3D" stroke="#E5B5C7" stroke-opacity="0.6"/>

  <!-- Drawn path (data line motif) -->
  <path d="M60 268 L180 230 L300 246 L430 190 L560 212 L690 150 L820 172 L950 110 L1140 128"
        fill="none" stroke="url(#kh-path)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1400" stroke-dashoffset="0" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="1400;0;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Text -->
  <text x="60" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F8F0F3" letter-spacing="1">Kishan Salian</text>
  <text x="62" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E5B5C7" letter-spacing="3">ASPIRING DATA ANALYST</text>
  <text x="62" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#C77B9B" letter-spacing="1.5">SQL  ·  Python  ·  Pandas  ·  MCA @ MIT, MAHE</text>

  <!-- Glowing underline -->
  <rect x="62" y="206" width="300" height="3" rx="1.5" fill="url(#kh-glow)" filter="url(#kh-blur)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="206" width="300" height="2" rx="1" fill="url(#kh-glow)"/>
</svg>
