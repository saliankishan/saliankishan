<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="ab-title ab-desc">
<title id="ab-title">About Kishan D Salian</title>
<desc id="ab-desc">MCA student at Manipal Institute of Technology, interested in data analytics, Python, SQL, predictive analytics and data engineering.</desc>
<defs>
  <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="ab-glow" cx="85%" cy="5%" r="85%"><stop stop-color="#701A3D" stop-opacity=".56"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  <linearGradient id="ab-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
  <pattern id="ab-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E5B5C7" stroke-opacity=".035" stroke-width="1"/></pattern>
  <clipPath id="portrait-clip"><circle cx="1000" cy="180" r="126"/></clipPath>
