<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="ab-title ab-desc">
<title id="ab-title">About Kishan D Salian</title>
<desc id="ab-desc">MCA student at Manipal Institute of Technology, interested in data analytics, Python, SQL, predictive analytics and data engineering.</desc>
<defs>
  <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="ab-glow" cx="85%" cy="5%" r="85%"><stop stop-color="#701A3D" stop-opacity=".56"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  <linearGradient id="ab-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
  <pattern id="ab-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E5B5C7" stroke-opacity=".035" stroke-width="1"/></pattern>
  <clipPath id="portrait-clip"><circle cx="1000" cy="180" r="126"/></clipPath>
  <filter id="portrait-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<style>
  .serif{font-family:Georgia,"Times New Roman",serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .fade{animation:fadein .9s ease both}
  .rise{animation:risein 1s cubic-bezier(.16,1,.3,1) both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes risein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.fade,.rise{animation:none}}
</style>
<rect width="1200" height="370" rx="20" fill="url(#ab-bg)"/>
<rect width="1200" height="370" rx="20" fill="url(#ab-glow)"/>
<rect width="1200" height="370" rx="20" fill="url(#ab-grid)"/>
<rect x=".7" y=".7" width="1198.6" height="368.6" rx="19.3" fill="none" stroke="#C77B9B" stroke-opacity=".24"/>
<g class="rise">
  <text class="mono" x="54" y="54" font-size="12" letter-spacing="3" fill="#C77B9B"><tspan fill="#E5B5C7">01</tspan> / ABOUT ME</text>
  <text class="serif" x="52" y="116" font-size="43" fill="#F8F0F3">Hello, I'm <tspan font-style="italic" fill="#E5B5C7">Kishan.</tspan></text>
  <text class="sans" x="55" y="151" font-size="16" letter-spacing="1.1" fill="#D9C5CC">MCA STUDENT  ·  MANIPAL INSTITUTE OF TECHNOLOGY, MAHE</text>
  <rect x="55" y="174" width="3" height="86" rx="1.5" fill="#C77B9B"/>
  <text class="sans" x="76" y="193" font-size="18" fill="#F0DDE4">I enjoy turning data into useful insights and building</text>
  <text class="sans" x="76" y="220" font-size="18" fill="#F0DDE4">practical applications that solve real problems.</text>
  <text class="sans" x="76" y="247" font-size="18" fill="#F0DDE4">Currently growing my skills in Python, SQL and analytics.</text>
</g>
<g class="rise" style="animation-delay:.2s">
  <rect x="55" y="287" width="565" height="43" rx="9" fill="#24121B" stroke="#70304A"/>
  <text class="mono" x="74" y="314" font-size="13" fill="#E9AFC1">PYTHON</text>
  <circle cx="166" cy="309" r="2" fill="#8B5368"/>
  <text class="mono" x="184" y="314" font-size="13" fill="#E9AFC1">SQL</text>
  <circle cx="235" cy="309" r="2" fill="#8B5368"/>
  <text class="mono" x="253" y="314" font-size="13" fill="#E9AFC1">PANDAS</text>
  <circle cx="344" cy="309" r="2" fill="#8B5368"/>
  <text class="mono" x="362" y="314" font-size="13" fill="#E9AFC1">PREDICTIVE ANALYTICS</text>
</g>
<g class="fade">
  <circle cx="1000" cy="183" r="145" fill="#C77B9B" opacity=".16" filter="url(#portrait-shadow)"/>
  <circle cx="1000" cy="180" r="132" fill="#24121B" stroke="#C77B9B" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="1000" cy="180" r="121" fill="none" stroke="#E5B5C7" stroke-opacity=".24" stroke-dasharray="3 7"/>
  <image href="kishan-portrait.png" x="865" y="45" width="270" height="270" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)"/>
  <circle cx="1000" cy="180" r="128" fill="none" stroke="#C77B9B" stroke-opacity=".6" stroke-width="1.5"/>
  <text class="mono" x="1000" y="343" text-anchor="middle" font-size="10" letter-spacing="2.5" fill="#C77B9B">LEARN  ·  BUILD  ·  ANALYSE</text>
</g>
</svg>